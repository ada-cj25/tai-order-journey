name: Core build verification (no deployment)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      # Full business regression tests live in the development workspace.
      # This workflow verifies the files needed to compile and package core.
      - run: npm run check
      - run: docker build --target api -t erp-api:verify .
      - run: docker build --target migrate -t erp-migrate:verify .
      - run: docker build --target backup-tool -t erp-backup:verify .
      - run: docker build --target personal-web -t erp-personal-web:verify .
      - run: docker build --target web -t erp-web:verify .
      - run: npm audit --omit=dev --audit-level=high
