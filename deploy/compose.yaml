name: ${DEPLOYMENT_NAME:?Set a distinct staging or production project name}
services:
  api:
    image: ${ERP_API_IMAGE:?Use an approved immutable image digest}
    env_file: ${ERP_RUNTIME_ENV_FILE:?Absolute path to protected runtime env file}
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      TRUST_PROXY_HOPS: "1"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
  web:
    image: ${ERP_WEB_IMAGE:?Use the web digest from the same release}
    environment:
      ERP_HOST: ${ERP_HOST:?Set the filed ERP domain}
      API_HOST: ${API_HOST:?Set the filed API domain}
      NGINX_ENVSUBST_FILTER: "^(ERP_HOST|API_HOST)$"
    ports: ["80:80", "443:443"]
    volumes:
      - type: bind
        source: ${ERP_TLS_DIRECTORY:?Absolute directory with fullchain.pem and privkey.pem}
        target: /etc/nginx/tls
        read_only: true
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
  migrate:
    image: ${ERP_MIGRATION_IMAGE:?Use the migration digest from the same release}
    profiles: ["maintenance"]
    env_file: ${ERP_MIGRATION_ENV_FILE:?Separate protected DDL credential env file}
    environment: { NODE_ENV: production, TZ: Asia/Shanghai }
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
