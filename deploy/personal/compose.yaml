name: ${DEPLOYMENT_NAME:?Set a distinct deployment name}

services:
  db:
    image: ${POSTGRES_IMAGE:?Use an approved immutable PostgreSQL 17 image digest}
    env_file: ${ERP_POSTGRES_ENV_FILE:?Use an absolute protected PostgreSQL env file}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    restart: unless-stopped
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  api:
    image: ${ERP_API_IMAGE:?Use an approved immutable API image digest}
    env_file: ${ERP_RUNTIME_ENV_FILE:?Use an absolute protected runtime env file}
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      TRUST_PROXY_HOPS: "1"
      COST_MODULE_ENABLED: "false"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  web:
    image: ${ERP_WEB_IMAGE:?Use the web digest from the same approved release}
    environment:
      ERP_HOST: ${ERP_HOST:?Set the filed production domain}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    image: ${ERP_MIGRATION_IMAGE:?Use the migration digest from the same approved release}
    profiles: ["maintenance"]
    env_file: ${ERP_MIGRATION_ENV_FILE:?Use an absolute protected owner credential env file}
    environment: { NODE_ENV: production, TZ: Asia/Shanghai }
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - type: bind
        source: ${ERP_BOOTSTRAP_DIRECTORY:?Use an absolute reviewed bootstrap directory}
        target: /bootstrap
        read_only: true
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  backup-tool:
    image: ${ERP_BACKUP_IMAGE:?Use the backup-tool digest from the same approved release}
    profiles: ["maintenance"]
    env_file: ${ERP_BACKUP_ENV_FILE:?Use a separate protected backup COS credential file}
    environment: { NODE_ENV: production, TZ: Asia/Shanghai }
    volumes:
      - type: bind
        source: ${ERP_BACKUP_DIRECTORY:?Use an absolute restricted backup directory}
        target: /backups
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  pg_data:
  caddy_data:
  caddy_config:
